        form.addEventListener('submit', e => {
            e.preventDefault()

            fetch(scriptURL, {
                method: 'POST',
                body: new FormData(form)
            })
                .then(response => {
                    alert('Order submitted successfully!')
                    window.location.reload()
                })
                .catch(error => console.error('Error!', error.message))
        })
    </script>

</body>

</html>
